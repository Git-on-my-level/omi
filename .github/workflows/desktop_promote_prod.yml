name: Promote Desktop Backend to Prod

# Promotes the prod desktop (Rust) backend only when a macOS GitHub release is
# explicitly marked stable. Prod deploys must always be coupled to a stable
# release tag, never to "latest main". Do not add push/pull_request triggers.
#
# Triggers:
#   release (published, edited) — primary path: deploys immediately when a
#     release is published or its channel is flipped to stable.
#   schedule (every 15 min) — safety-net reconciler: GitHub does not reliably
#     emit Actions runs for release edits, so the schedule catches any missed
#     edit and deploys the newest channel:stable release (roll-forward only).
#   workflow_dispatch — manual retry/rollback; requires an explicit stable tag.
#
# All paths deploy only if the target release:
#   1. has a tag matching v*-macos, and
#   2. has an exact metadata line: channel: stable
# force=true bypasses only the roll-forward guard, not the stable check.

on:
  release:
    types: [published, edited]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Stable v*-macos release tag to deploy'
        required: true
      force:
        description: 'Deploy even if not newer than current prod (allows rollback)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-backend-promote-prod
  cancel-in-progress: false

env:
  SERVICE: desktop-backend
  REGION: us-central1
  TRACK_TAG: desktop-backend-prod-deployed

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.c.outputs.deploy }}
      target_sha: ${{ steps.c.outputs.target_sha }}
      target_tag: ${{ steps.c.outputs.target_tag }}
    steps:
      - name: Checkout (full history + tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine target + roll-forward decision
        id: c
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PATH: ${{ github.event_path }}
          OVERRIDE_TAG: ${{ github.event.inputs.tag }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          set -euo pipefail

          is_stable_release_body() {
            grep -qiE '^[[:space:]]*channel:[[:space:]]*stable[[:space:]]*$'
          }

          TARGET_TAG=""
          RELEASE_BODY=""
          if [ "$EVENT_NAME" = "release" ]; then
            # The release itself is the target (published or channel-flipped).
            TARGET_TAG=$(python3 - <<'PY'
          import json
          import os

          with open(os.environ["EVENT_PATH"]) as f:
              event = json.load(f)
          print(event.get("release", {}).get("tag_name", ""))
          PY
          )
            RELEASE_BODY=$(python3 - <<'PY'
          import json
          import os

          with open(os.environ["EVENT_PATH"]) as f:
              event = json.load(f)
          print(event.get("release", {}).get("body") or "")
          PY
          )
          elif [ "$EVENT_NAME" = "schedule" ]; then
            # Safety-net reconciler: GitHub does not reliably emit Actions runs
            # for release edits. Scan for the newest channel:stable release and
            # deploy it (roll-forward guard below prevents downgrades).
            for tag in $(gh release list --repo "$REPO" --limit 30 --json tagName -q '.[].tagName' | grep -- '-macos'); do
              body=$(gh release view "$tag" --repo "$REPO" --json body -q .body)
              if printf '%s\n' "$body" | is_stable_release_body; then
                TARGET_TAG="$tag"
                break
              fi
            done
            if [ -z "$TARGET_TAG" ]; then
              echo "No channel:stable desktop release found; nothing to do."
              echo "deploy=false" >> "$GITHUB_OUTPUT"
              echo "reason=No channel:stable desktop release found." >> "$GITHUB_OUTPUT"
              exit 0
            fi
            RELEASE_BODY=$(gh release view "$TARGET_TAG" --repo "$REPO" --json body -q .body)
          else
            TARGET_TAG="${OVERRIDE_TAG:-}"
            if [ -z "$TARGET_TAG" ]; then
              echo "Manual prod promotion requires a stable v*-macos release tag."
              echo "deploy=false" >> "$GITHUB_OUTPUT"
              echo "reason=Manual prod promotion requires a stable v*-macos release tag." >> "$GITHUB_OUTPUT"
              exit 0
            fi
            RELEASE_BODY=$(gh release view "$TARGET_TAG" --repo "$REPO" --json body -q .body)
          fi

          if ! printf '%s\n' "$TARGET_TAG" | grep -qE '^v.+-macos$'; then
            echo "Release tag '$TARGET_TAG' is not a macOS desktop release; nothing to do."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "reason=Release tag '$TARGET_TAG' is not a macOS desktop release." >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! printf '%s\n' "$RELEASE_BODY" | is_stable_release_body; then
            echo "Release $TARGET_TAG is not marked channel: stable; nothing to do."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "reason=Release $TARGET_TAG is not marked channel: stable." >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TARGET_SHA=$(git rev-list -n1 "$TARGET_TAG" 2>/dev/null || true)
          if [ -z "$TARGET_SHA" ]; then
            TARGET_SHA=$(gh api "repos/$REPO/git/ref/tags/$TARGET_TAG" --jq '.object.sha')
          fi
          CURRENT_SHA=$(git rev-list -n1 "$TRACK_TAG" 2>/dev/null || echo "")
          echo "target=$TARGET_TAG ($TARGET_SHA) | tracked-prod=$CURRENT_SHA | force=${FORCE:-false}"

          DEPLOY=true
          if [ "${FORCE:-false}" = "true" ]; then
            DEPLOY=true
          elif [ "$TARGET_SHA" = "$CURRENT_SHA" ]; then
            DEPLOY=false   # already on prod
          elif [ -n "$CURRENT_SHA" ] && git merge-base --is-ancestor "$TARGET_SHA" "$CURRENT_SHA"; then
            DEPLOY=false   # target is older than prod — never auto-downgrade
          fi

          echo "deploy=$DEPLOY" >> "$GITHUB_OUTPUT"
          echo "target_sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
          echo "target_tag=$TARGET_TAG" >> "$GITHUB_OUTPUT"
          echo "reason=Decision - deploy=$DEPLOY for stable release $TARGET_TAG" >> "$GITHUB_OUTPUT"
          echo "Decision - deploy=$DEPLOY for $TARGET_TAG" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: check
    if: needs.check.outputs.deploy == 'true'
    environment: prod
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-latest-m
    steps:
      - name: Delete huge unnecessary tools folder
        run: rm -rf /opt/hostedtoolcache

      - name: Checkout target commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.target_sha }}
          fetch-depth: 0

      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Login to GCR
        run: gcloud auth configure-docker

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Google Service Account
        run: echo "${{ secrets.GCP_SERVICE_ACCOUNT }}" | base64 -d > ./desktop/macos/Backend-Rust/google-credentials.json

      - name: Build and Push Desktop Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./desktop/macos/Backend-Rust
          file: ./desktop/macos/Backend-Rust/Dockerfile
          push: true
          tags: |
            gcr.io/${{ vars.GCP_PROJECT_ID }}/${{ env.SERVICE }}:${{ needs.check.outputs.target_sha }}
            gcr.io/${{ vars.GCP_PROJECT_ID }}/${{ env.SERVICE }}:prod
          cache-from: type=registry,ref=gcr.io/${{ vars.GCP_PROJECT_ID }}/${{ env.SERVICE }}:buildcache
          cache-to: type=registry,ref=gcr.io/${{ vars.GCP_PROJECT_ID }}/${{ env.SERVICE }}:buildcache,mode=max

      - name: Deploy Desktop Backend to Production
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: gcr.io/${{ vars.GCP_PROJECT_ID }}/${{ env.SERVICE }}:${{ needs.check.outputs.target_sha }}
          flags: '--allow-unauthenticated'
          env_vars: |
            FIREBASE_PROJECT_ID=based-hardware
            GOOGLE_APPLICATION_CREDENTIALS=/app/google-credentials.json
            AGENT_GCS_BUCKET=based-hardware-agent
          secrets: |
            ENCRYPTION_SECRET=ENCRYPTION_SECRET:latest
            GEMINI_API_KEY=DESKTOP_GEMINI_API_KEY:latest
            OPENAI_API_KEY=OPENAI_API_KEY:latest
            REDIS_DB_PASSWORD=DESKTOP_REDIS_DB_PASSWORD:latest
            FIREBASE_API_KEY=DESKTOP_FIREBASE_API_KEY:latest
            REDIS_DB_HOST=DESKTOP_REDIS_DB_HOST:latest
            REDIS_DB_PORT=DESKTOP_REDIS_DB_PORT:latest
            DEEPGRAM_API_KEY=DESKTOP_DEEPGRAM_API_KEY:latest
            ANTHROPIC_API_KEY=DESKTOP_ANTHROPIC_API_KEY:latest
            DESKTOP_LEGACY_ANTHROPIC_KEY=DESKTOP_LEGACY_ANTHROPIC_KEY:latest
            GOOGLE_CALENDAR_API_KEY=DESKTOP_GOOGLE_CALENDAR_API_KEY:latest

      - name: Generate Omi Bot token for prod-tracking tag
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.OMI_BOT_APP_ID }}
          private-key: ${{ secrets.OMI_BOT_PRIVATE_KEY }}

      - name: Advance prod-tracking tag
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TARGET_SHA: ${{ needs.check.outputs.target_sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/update-desktop-backend-prod-ref.json
          import json
          import os

          print(json.dumps({"sha": os.environ["TARGET_SHA"], "force": True}))
          PY
          if ! gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TRACK_TAG}" --input /tmp/update-desktop-backend-prod-ref.json >/dev/null; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/${TRACK_TAG}" -f sha="${TARGET_SHA}" >/dev/null
          fi
          echo "Promoted desktop-backend to PROD - ${{ needs.check.outputs.target_tag }} (${{ needs.check.outputs.target_sha }})" >> "$GITHUB_STEP_SUMMARY"
